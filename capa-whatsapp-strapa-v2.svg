<svg width="1640" height="856" viewBox="0 0 1640 856" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&amp;family=Playfair+Display:wght@700;800&amp;display=swap');
    </style>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2E6BFF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#2E6BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===================== FUNDO ===================== -->
  <g id="fundo">
    <rect width="1640" height="856" fill="#0B1A2F"/>
    <rect width="1640" height="856" fill="url(#glow)"/>
    <path id="grade-vertical" d="M64 0V856M128 0V856M192 0V856M256 0V856M320 0V856M384 0V856M448 0V856M512 0V856M576 0V856M640 0V856M704 0V856M768 0V856M832 0V856M896 0V856M960 0V856M1024 0V856M1088 0V856M1152 0V856M1216 0V856M1280 0V856M1344 0V856M1408 0V856M1472 0V856M1536 0V856M1600 0V856" stroke="#F5F8FF" stroke-opacity="0.06"/>
    <path id="grade-horizontal" d="M0 64H1640M0 128H1640M0 192H1640M0 256H1640M0 320H1640M0 384H1640M0 448H1640M0 512H1640M0 576H1640M0 640H1640M0 704H1640M0 768H1640M0 832H1640" stroke="#F5F8FF" stroke-opacity="0.06"/>
  </g>

  <!-- ===================== COLUNA ESQUERDA ===================== -->
  <g id="eyebrow-esquerda">
    <text x="112" y="100" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" font-style="italic" letter-spacing="3.6" fill="#3D7BFA">INTELIGÊNCIA ARTIFICIAL PRA NEGÓCIO LOCAL</text>
    <rect x="112" y="116" width="118" height="3" rx="1.5" fill="#3D7BFA"/>
  </g>

  <g id="logo">
    <g id="logo-hexagono" transform="translate(110 150) scale(0.92)">
      <path id="hex-topo" d="M11 28 L50 6 L89 28 L89 34 L11 50 Z" fill="#2E6BFF"/>
      <path id="hex-meio" d="M11 50 L89 34 L89 50 L11 66 Z" fill="#F5F8FF"/>
      <path id="hex-base" d="M11 66 L89 50 L89 72 L50 94 L11 72 Z" fill="#1747B8"/>
    </g>
    <text id="wordmark" x="224" y="222" font-family="'Playfair Display', Georgia, serif" font-size="70" font-weight="800"><tspan fill="#F5F8FF">Strapa</tspan><tspan fill="#2E6BFF">.AI</tspan></text>
  </g>

  <g id="tagline">
    <text x="112" y="322" font-family="Inter, Arial, sans-serif" font-size="37" font-weight="400" fill="#93A6C2">Presença digital que traz</text>
    <text x="112" y="372" font-family="Inter, Arial, sans-serif" font-size="37" font-weight="700" fill="#F5F8FF">cliente pra dentro.</text>
  </g>

  <g id="servicos">
    <g id="servico-1">
      <rect x="112" y="428" width="5" height="31" rx="2.5" fill="#3D7BFA"/>
      <text x="130" y="452" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#F5F8FF">Sites</text>
    </g>
    <g id="servico-2">
      <rect x="112" y="486" width="5" height="31" rx="2.5" fill="#3D7BFA"/>
      <text x="130" y="510" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#F5F8FF">Atendimento no WhatsApp</text>
    </g>
    <g id="servico-3">
      <rect x="112" y="544" width="5" height="31" rx="2.5" fill="#3D7BFA"/>
      <text x="130" y="568" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#F5F8FF">Conteúdo pra Instagram</text>
    </g>
    <g id="servico-4">
      <rect x="112" y="602" width="5" height="31" rx="2.5" fill="#3D7BFA"/>
      <text x="130" y="626" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#F5F8FF">Tráfego pago</text>
    </g>
  </g>

  <g id="localizacao">
    <circle cx="116" cy="711" r="5" fill="#3D7BFA"/>
    <text x="134" y="719" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#93A6C2">Curitiba e região</text>
  </g>

  <!-- ===================== COLUNA DIREITA (complementar) ===================== -->
  <g id="bloco-direita">
    <g id="eyebrow-direita">
      <text x="1528" y="100" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" font-style="italic" letter-spacing="3.6" fill="#3D7BFA">POR QUE A STRAPA</text>
      <rect x="1410" y="116" width="118" height="3" rx="1.5" fill="#3D7BFA"/>
    </g>

    <g id="diferenciais">
      <g id="dif-1">
        <text x="1508" y="452" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#C6D2E6">Autoridade que atrai clientes</text>
        <rect x="1520" y="428" width="5" height="31" rx="2.5" fill="#3D7BFA"/>
      </g>
      <g id="dif-2">
        <text x="1508" y="510" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#C6D2E6">IA trabalhando por você</text>
        <rect x="1520" y="486" width="5" height="31" rx="2.5" fill="#3D7BFA"/>
      </g>
      <g id="dif-3">
        <text x="1508" y="568" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#C6D2E6">Resultado que dá pra medir</text>
        <rect x="1520" y="544" width="5" height="31" rx="2.5" fill="#3D7BFA"/>
      </g>
    </g>

    <g id="contato-direita">
      <text x="1508" y="719" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#93A6C2">@strapa.ai</text>
      <g transform="translate(1512 701) scale(0.2)">
        <path d="M50 6 L60.8 39.2 L94 50 L60.8 60.8 L50 94 L39.2 60.8 L6 50 L39.2 39.2 Z" fill="#3D7BFA"/>
      </g>
    </g>
  </g>

  <!-- ===================== GUIA (apague antes de exportar) ===================== -->
  <g id="GUIA-foto-perfil-APAGUE" opacity="0.5">
    <circle cx="820" cy="428" r="188" fill="#3D7BFA" fill-opacity="0.05" stroke="#3D7BFA" stroke-width="2" stroke-dasharray="9 9"/>
    <text x="820" y="422" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#3D7BFA">FOTO DE PERFIL</text>
    <text x="820" y="448" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D7BFA">apague esta guia antes de exportar</text>
  </g>
</svg>
