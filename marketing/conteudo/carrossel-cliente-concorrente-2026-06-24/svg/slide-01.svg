<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap');
      .t{font-family:'Space Grotesk','Segoe UI',sans-serif;font-weight:700}
      .b{font-family:'Inter','Segoe UI',sans-serif}
    </style>
    <radialGradient id="glow" cx="82%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#2E6BFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#2E6BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="fundo">
    <rect width="1080" height="1350" fill="#0B1A2F"/>
    <rect width="1080" height="1350" fill="url(#glow)"/>
  </g>

  <g id="logo">
    <g transform="translate(90,62) scale(0.30)"><path d="M50 6 L60.8 39.2 L94 50 L60.8 60.8 L50 94 L39.2 60.8 L6 50 L39.2 39.2 Z" fill="#2E6BFF"/></g>
    <text class="t" x="130" y="90" font-size="30" letter-spacing="-1"><tspan fill="#F5F8FF">strapa</tspan><tspan fill="#2E6BFF">.ai</tspan></text>
  </g>
  <text id="contador" class="b" x="990" y="90" text-anchor="end" font-size="26" fill="rgba(245,248,255,0.55)">01 / 09</text>

  <text id="kicker" class="b" x="90" y="600" font-size="24" font-weight="700" letter-spacing="6" fill="#2E6BFF">PRA DONO DE NEGÓCIO LOCAL</text>
  <rect id="regua" x="90" y="624" width="72" height="5" fill="#2E6BFF"/>

  <text id="titulo" class="t" x="90" y="760" font-size="98" letter-spacing="-3" fill="#F5F8FF">
    <tspan x="90" dy="0">O cliente</tspan>
    <tspan x="90" dy="106">não sumiu.</tspan>
    <tspan x="90" dy="106">Foi pro</tspan>
    <tspan x="90" dy="106" fill="#2E6BFF">concorrente.</tspan>
  </text>

  <text id="hint" class="b" x="90" y="1250" font-size="26" fill="rgba(245,248,255,0.55)">arraste para o lado  →</text>
</svg>
