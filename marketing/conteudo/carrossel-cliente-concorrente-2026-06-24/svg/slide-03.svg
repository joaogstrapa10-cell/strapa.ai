<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap');
      .t{font-family:'Space Grotesk','Segoe UI',sans-serif;font-weight:700}
      .b{font-family:'Inter','Segoe UI',sans-serif}
    </style>
  </defs>

  <g id="fundo"><rect width="1080" height="1350" fill="#0B1A2F"/></g>

  <g id="logo">
    <g transform="translate(90,62) scale(0.30)"><path d="M50 6 L60.8 39.2 L94 50 L60.8 60.8 L50 94 L39.2 60.8 L6 50 L39.2 39.2 Z" fill="#2E6BFF"/></g>
    <text class="t" x="130" y="90" font-size="30" letter-spacing="-1"><tspan fill="#F5F8FF">strapa</tspan><tspan fill="#2E6BFF">.ai</tspan></text>
  </g>
  <text id="contador" class="b" x="990" y="90" text-anchor="end" font-size="26" fill="rgba(245,248,255,0.55)">03 / 09</text>

  <text id="kicker" class="b" x="90" y="470" font-size="24" font-weight="700" letter-spacing="6" fill="#2E6BFF">ACHAM VOCÊ?</text>
  <rect id="regua" x="90" y="494" width="72" height="5" fill="#2E6BFF"/>

  <text id="titulo" class="t" x="90" y="640" font-size="86" letter-spacing="-2.5" fill="#F5F8FF">
    <tspan x="90" dy="0">Procuram o que</tspan>
    <tspan x="90" dy="96">você vende</tspan>
    <tspan x="90" dy="96">todo dia.</tspan>
  </text>

  <text id="corpo" class="b" x="90" y="1050" font-size="42" font-weight="500" fill="rgba(245,248,255,0.82)">
    <tspan x="90" dy="0">A única pergunta:</tspan>
    <tspan x="90" dy="56">te acham — ou <tspan class="t" font-weight="700" fill="#2E6BFF">acham ele?</tspan></tspan>
  </text>
</svg>
