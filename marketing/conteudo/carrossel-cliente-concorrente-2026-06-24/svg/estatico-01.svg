<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap');
      .t{font-family:'Space Grotesk','Segoe UI',sans-serif;font-weight:700}
      .b{font-family:'Inter','Segoe UI',sans-serif}
    </style>
    <radialGradient id="glowE" cx="84%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#2E6BFF" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#2E6BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="fundo">
    <rect width="1080" height="1350" fill="#0B1A2F"/>
    <rect width="1080" height="1350" fill="url(#glowE)"/>
  </g>

  <g id="logo">
    <g transform="translate(90,72) scale(0.32)"><path d="M50 6 L60.8 39.2 L94 50 L60.8 60.8 L50 94 L39.2 60.8 L6 50 L39.2 39.2 Z" fill="#2E6BFF"/></g>
    <text class="t" x="134" y="102" font-size="32" letter-spacing="-1"><tspan fill="#F5F8FF">strapa</tspan><tspan fill="#2E6BFF">.ai</tspan></text>
  </g>

  <text id="aspas" class="t" x="84" y="430" font-size="200" fill="rgba(46,107,255,0.25)">“</text>

  <text id="frase" class="t" x="90" y="600" font-size="80" letter-spacing="-2.5" fill="#F5F8FF">
    <tspan x="90" dy="0">Não falta</tspan>
    <tspan x="90" dy="90">cliente.</tspan>
    <tspan x="90" dy="150" font-size="64" fill="rgba(245,248,255,0.92)">Falta <tspan fill="#2E6BFF">estar presente</tspan></tspan>
    <tspan x="90" dy="76" font-size="64" fill="rgba(245,248,255,0.92)">na hora que ele</tspan>
    <tspan x="90" dy="76" font-size="64" fill="rgba(245,248,255,0.92)">decide comprar.</tspan>
  </text>

  <text id="assinatura" class="b" x="90" y="1250" font-size="28" font-weight="600" fill="rgba(245,248,255,0.6)">strapa.ai · IA pra negócios locais</text>
</svg>
