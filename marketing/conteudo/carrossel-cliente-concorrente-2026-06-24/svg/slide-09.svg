    <text class="t" x="540" y="860" text-anchor="middle" font-size="108" letter-spacing="-3"><tspan fill="#F5F8FF">strapa</tspan><tspan fill="#2E6BFF">.ai</tspan></text>
  </g>

  <text id="tagline" class="b" x="540" y="955" text-anchor="middle" font-size="30" font-weight="500" fill="rgba(245,248,255,0.62)">Inteligência artificial pra negócios locais · Curitiba</text>
  <text id="handle" class="b" x="540" y="1030" text-anchor="middle" font-size="34" font-weight="700" fill="#2E6BFF">@strapa.ai</text>
