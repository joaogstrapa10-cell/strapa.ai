<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap');
      .t{font-family:'Space Grotesk','Segoe UI',sans-serif;font-weight:700}
      .b{font-family:'Inter','Segoe UI',sans-serif}
    </style>
    <radialGradient id="glow9" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#2E6BFF" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#2E6BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="fundo">
    <rect width="1080" height="1350" fill="#0B1A2F"/>
    <rect width="1080" height="1350" fill="url(#glow9)"/>
  </g>
  <text id="contador" class="b" x="990" y="90" text-anchor="end" font-size="26" fill="rgba(245,248,255,0.55)">09 / 09</text>

  <text id="fecho" class="b" x="540" y="470" text-anchor="middle" font-size="50" font-weight="500" fill="rgba(245,248,255,0.9)">
    <tspan x="540" dy="0">Tem negócio igual ao seu</tspan>
    <tspan x="540" dy="66">já fazendo isso. <tspan class="t" font-weight="700" fill="#F5F8FF">Sem alarde.</tspan></tspan>
  </text>

  <g id="logo-grande">
