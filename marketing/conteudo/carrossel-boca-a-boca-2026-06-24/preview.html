<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strapa.ai — Carrossel "A morte do boca a boca" (preview)</title>
<style>
  body{margin:0;background:#0A0E14;font-family:'Segoe UI',system-ui,sans-serif;color:#F5F8FF;padding:40px}
  h1{font-size:20px;font-weight:600;margin:0 0 6px}
  p{color:#7c899c;font-size:14px;margin:0 0 28px}
  .grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
  .card{width:360px}
  .card .frame{width:360px;height:450px;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#0B1A2F}
  .card object{width:360px;height:450px;border:0;display:block}
  .card span{display:block;margin-top:8px;font-size:12px;color:#7c899c;text-align:center}
</style>
</head>
<body>
  <h1>Carrossel — "A morte do boca a boca"</h1>
  <p>Preview dos 6 slides. Slide 3 já com a foto embutida. (As fontes Space Grotesk/Inter carregam do Google Fonts.)</p>
  <div class="grid">
    <div class="card"><div class="frame"><object type="image/svg+xml" data="svg/slide-01.svg"></object></div><span>1 — Capa</span></div>
    <div class="card"><div class="frame"><object type="image/svg+xml" data="svg/slide-02.svg"></object></div><span>2 — A engrenagem que travou</span></div>
    <div class="card"><div class="frame"><object type="image/svg+xml" data="svg/slide-03.svg"></object></div><span>3 — Onde a decisão acontece (com foto)</span></div>
    <div class="card"><div class="frame"><object type="image/svg+xml" data="svg/slide-04.svg"></object></div><span>4 — Os números (96%)</span></div>
    <div class="card"><div class="frame"><object type="image/svg+xml" data="svg/slide-05.svg"></object></div><span>5 — A virada</span></div>
    <div class="card"><div class="frame"><object type="image/svg+xml" data="svg/slide-06.svg"></object></div><span>6 — Fecho</span></div>
  </div>
</body>
</html>
